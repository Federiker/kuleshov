[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The same minor version as rust-toolchain.toml.
rust-version = "1.94"
license = "CC0-1.0"
repository = "https://github.com/Federiker/kuleshov"
# Never on crates.io: manuzio and melies pin the repository by commit (owner decision, 27 October 2026).
publish = false

[workspace.dependencies]
kuleshov = { path = "crates/kuleshov" }
kuleshov_parity = { path = "crates/parity" }
# The `download` feature: blocking HTTPS with rustls (ring, webpki roots), ZIP (deflate) and tar.xz.
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz", "optimization"] }
tar = { version = "0.4.46", default-features = false }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
sha2 = "0.11"
tokio = { version = "1.54.1", features = ["rt"] }
uuid = { version = "1.19.0", features = ["v4"] }

[workspace.lints.rust]
# Denied rather than forbidden: the one Windows test that asks whether a child has a console
# window calls the system directly, under `#[expect(unsafe_code, reason = ...)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Panics outside tests are explicit (`#[expect(..., reason = ...)]`); tests may unwrap (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"

# Less debug info in dev builds and tests: line tables for our crates (enough
# for backtraces), none for dependencies. Smaller files, faster linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Checksums and archives at full speed in dev builds and tests: the download test runs the two
# FFmpeg programs (about 200 MB) through SHA-256 and the ZIP's CRC-32, which take most of a minute
# unoptimised.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

# Full debug info for kuleshov's crates in debugger sessions (`cargo build
# --profile debugging`, used by .vscode/launch.json); line tables only for
# dependencies. Kept in target/debugging so it never invalidates the everyday
# dev build.
[profile.debugging]
inherits = "dev"
debug = true

[profile.debugging.package."*"]
debug = "line-tables-only"
