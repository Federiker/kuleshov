# typos checks spelling in code and docs, in UK English. Every allowed word below says why it is
# allowed.

[default]
locale = "en-gb"
# Other software's names, matched in context so the same words in prose are still checked: `ps -ax`
# (scripts/process.ts).
# FFmpeg's own option names (crates/kuleshov/src): `anoisesrc=color=pink`, `amix=…:normalize=0`,
# ffprobe's `color_range` and its siblings.
extend-ignore-re = ['"-ax"', 'color=pink', 'normalize=0', 'color_(range|space|transfer|primaries)']

[default.extend-words]
# Names other software fixes: serde's Serialize (and `skip_serializing_if`), the sha2 crate's
# `finalize`.
serialize = "serialize"
serializing = "serializing"
finalize = "finalize"
# `analyze_audio` and its module keep manuzio's names, so that manuzio's calls stay the same.
analyze = "analyze"

[files]
extend-exclude = [
  "*.lock",
  # The CC0 legal code, as Creative Commons publishes it.
  "LICENSE",
  # Pinned references: argument lists and hashes recorded from manuzio, compared exactly.
  "crates/parity/references/",
]
