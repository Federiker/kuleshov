# Developer tools, pinned (the same versions as jespersen's and jerome's). `mise install` installs
# them; scripts/install.bat and scripts/install.sh set up a whole machine.
# Rust itself is pinned in rust-toolchain.toml and installed by rustup.
min_version = "2026.10.0"

[settings]
# mise.lock records each tool's exact version and checksums, as bun.lock does for the packages.
lockfile = true

[env]
# The scripts' packages' programs (biome, tsc) run without `bun x`.
_.path = ["{{config_root}}/node_modules/.bin"]
# Where the tests find ffmpeg and ffprobe: the pinned build `mise run tools` stages. A test-only
# variable; the library itself never reads the environment. To use FFmpeg from elsewhere (such as
# a sibling checkout's staged copy), set it in the gitignored mise.local.toml, which wins.
KULESHOV_TOOLS_DIR = "{{config_root}}/tools"

[tools]
# Lets the `cargo:` tools below install prebuilt binaries instead of compiling.
cargo-binstall = "1.26.0"
"cargo:cargo-nextest" = "0.9.149"
"cargo:cargo-machete" = "0.9.2"
"cargo:cargo-llvm-cov" = "0.9.1"
cargo-deny = "0.20.2"
typos = "1.51.1"
lychee = "0.24.2"
lefthook = "2.2.2"
# Runs the TypeScript scripts (staging FFmpeg) and their tests.
bun = "1.4.2"

# The repository's commands: `mise run <task>` (`mise tasks` lists them). Arguments after the
# task's name are passed on, e.g. `mise run test -p kuleshov`.

# Develop.
[tasks.clean]
description = "Remove build outputs"
run = "cargo clean"

[tasks.fix]
description = "Format the Rust code and the scripts, with Biome's safe fixes"
run = ["cargo fmt --all", "biome check --write"]

# FFmpeg for the tests: never bundled with the library or committed (README, "FFmpeg").
[tasks.tools]
description = "Stage the pinned FFmpeg and FFprobe in tools/ (downloaded once, checksum verified)"
run = "bun scripts/stage-ffmpeg.ts"

# Check.
[tasks.check]
description = "cargo check of the workspace, and of the library with the tokio feature"
run = [
  "cargo check --workspace --all-targets",
  "cargo check -p kuleshov --features tokio",
]

[tasks.fmt]
description = "Check the formatting of the Rust code and the scripts"
run = ["cargo fmt --all --check", "biome ci"]

[tasks.clippy]
description = "Clippy, warnings denied"
run = "cargo clippy --workspace --all-targets --all-features -- --deny warnings"

[tasks.typecheck]
description = "Type-check the TypeScript scripts"
run = "tsc --noEmit -p scripts"

[tasks.spell]
description = "Spelling (typos.toml)"
run = "typos"

[tasks.links]
description = "Broken links in the Markdown files (lychee.toml)"
run = "lychee --no-progress README.md AGENTS.md CLAUDE.md TODO.md docs crates"

[tasks.machete]
description = "Unused Rust dependencies"
run = "cargo machete"

[tasks.deny]
description = "Licences, bans and sources (advisories run weekly in CI)"
run = "cargo deny check licenses bans sources"

[tasks.audit]
description = "Advisories, licences, bans and sources"
run = "cargo deny check"

# Test. The Rust tests run FFmpeg: they read KULESHOV_TOOLS_DIR (see [env]) and fail, naming the
# folder, when it holds no ffmpeg or ffprobe.
[tasks.test]
description = "The tests, with nextest, then the doctests (nextest does not run them)"
run = [
  "cargo nextest run --workspace --all-features",
  "cargo test --workspace --all-features --doc",
]

[tasks.coverage]
description = "The tests, at 90% coverage or more (CI adds --profile ci)"
run = "cargo llvm-cov nextest --workspace --all-features --fail-under-lines 90 --fail-under-regions 90"

[tasks."scripts:test"]
description = "The scripts' tests (bun test)"
run = "bun test scripts"

# What CI's Checks workflow runs, in its order: the quick checks first, so they fail fast.
[tasks.ci]
description = "Every check CI runs"
run = [
  { tasks = ["fmt", "spell", "links"] },
  { tasks = ["machete", "deny", "typecheck", "scripts:test"] },
  { task = "clippy" },
  { task = "check" },
  { task = "coverage" },
]
