# cargo-deny: licences, bans, sources and security advisories for the Rust dependencies.
# `mise run audit` runs every check; CI runs licences, bans and sources on every push and the
# advisories weekly. FFmpeg is not a dependency: callers supply it, and its builds keep their own
# licences (README, "FFmpeg").

[graph]
# Optional features count too: the `download` feature's dependencies are checked like the rest.
all-features = true

[advisories]
# Unmaintained crates count only when a kuleshov crate depends on them directly.
unmaintained = "workspace"
yanked = "warn"
# Each ignored advisory needs its id and the reason, e.g.
# { id = "RUSTSEC-0000-0000", reason = "..." },
ignore = []

[licenses]
# Permissive licences only, as in jespersen: kuleshov is CC0 and is linked into closed-source
# programs, so no copyleft, weak or strong. A dependency under any other licence fails until the
# owner approves it here.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots (Mozilla's root certificates, for the `download` feature's HTTPS), as manuzio and
  # jerome allow it: permissive data licence, no copyleft.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# The list is the policy, not an inventory: a licence no dependency uses yet is no warning.
unused-allowed-license = "allow"

[licenses.private]
# kuleshov's own crates (`publish = false`).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates are path dependencies.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
