name: Advisories

# Known vulnerabilities in the Rust crates (cargo-deny, RustSec). Runs only when started by hand.
# Kept out of the Checks workflow so a new advisory never fails those checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: cargo deny check advisories
